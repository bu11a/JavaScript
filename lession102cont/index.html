<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>MiniShop</h1>

        <a href="./index.html" class="link">Вернуться назад</a>
    </header>
    <main>
        <form id="authForm" class="auth-form">
            <h2>Вход и регистрация</h2>

            <p>Напишите пароль.</p>

            <label for="usernameInput">Логин</label>
            <input 
                type="text"
                id="usernameInput"
                placeholder="Минимум 3 символов"
                minlength="3"
                required
                >
            <label for="passwordInput">Пароль</label>
            <input 
                type="password"
                id="passwordInput"
                placeholder="Минимум 6 символов"
                minlength="6"
                required
                >

            <button type="submit" id="loginBtn">Войти</button>
            <button type="submit" id="registerBtn">Регистрация</button>
            <p id="authMessage"></p>
        </form>
    </main>
    <script type="module" src="./js/authPage.js"></script>
</body>
</html>
