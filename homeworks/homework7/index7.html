<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style7.css">
</head>
<body>

    <div class="game">
        <h1>Угадайте число от 1 до 100</h1>

        <input type="number" id="numberInput" placeholder="Введите число">

        <button id="checkButton">Проверить</button>

        <p id="message">Введите число</p>

        <p>Количество попыток: <span id="attempts">0</span></p>

        <button id="restartButton">Играть заново</button>
    </div>

    <script src="script7.js"></script>
</body>
