<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
       <h1>Project card generator</h1>
    <div class="form">
        <input id="projectName" type="text" placeholder="Project name">
        <input id="authorName" type="text" placeholder="Author name">
        <textarea id="projectDescription" placeholder="Project text"></textarea>

        <select id="projectColors">
            <option value="Blue">Blue</option>
            <option value="Red">Red</option>
            <option value="green">Green</option>
        </select>
        <select id="textColors">
            <option value="Blue">Blue</option>
            <option value="Red">Red</option>
            <option value="green">Green</option>
        </select>

        <button>Create</button>
    </div>
    <div class="card">
        <h2 class="cardTitle ">Project name</h2>
        <p class="cardName ">name</p>
        <p class="cardText ">text</p>
    </div>
        <script src="script.js"></script> 
</body>
</html>
