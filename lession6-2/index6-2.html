<!DOCTYPE html>
<html lang="en">

<head>

<body>
    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Todo List</title>

        <link rel="stylesheet" href="style6-2.css">
    </head>

    <body>

        <h1 class="title">Todo List</h1>

        <div class="mainInput">

            <h3>Enter title:</h3>
            <input type="text" id="todoTitle" class="todoInput">

            <h3>Enter description:</h3>
            <input type="text" id="todoDescription" class="todoInput">
            <h3>Enter deadline:</h3>
            <input type="date" id="todoDeadline" class="todoInput">

            <button id="addTodoBtn">
                Add Todo
            </button>

        </div>
        <center>
            <h3 id="todoCount">Total tasks: 0</h3>
            <div id="filters">
                <button id="allBtn">All</button>
                <button id="activeBtn">Active</button>
                <button id="completedBtn">Completed</button>
            </div>
            <h2>Todo List:</h2>
        </center>

        <div class="todoList">
        </div>

        <script src="script6-2.js"></script>
    </body>

    </html>
</body>

</html>
